:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#202a38;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}header{background:#17263c;color:white;padding:20px 28px}h1{font-size:22px;margin:0 0 5px}header p{margin:0;color:#b9c7d9;font-size:13px}.layout{display:grid;grid-template-columns:350px 1fr;min-height:calc(100vh - 85px)}aside{background:white;border-right:1px solid #dce2ea;padding:18px;overflow:auto;height:calc(100vh - 85px);position:sticky;top:0}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;margin-bottom:10px}.muted{color:#68788b;font-size:13px}.item{cursor:pointer;border:1px solid #e2e8ef;border-radius:9px;margin:8px 0;padding:10px;display:flex;gap:10px;align-items:center}.item:hover,.item.active{border-color:#4875b6;background:#f0f6ff}.item img{width:60px;height:50px;object-fit:contain;background:#f4f6f9}.item strong{display:block;font-size:14px}.item span{display:block;font-size:12px;color:#65758a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}main{padding:25px 32px;max-width:1300px}.empty{padding:70px;color:#78869a;text-align:center}.summary{margin-bottom:20px}h2{margin:0 0 6px;font-size:23px}.event{background:white;border:1px solid #dee5ed;border-radius:12px;margin:16px 0;padding:20px;box-shadow:0 2px 7px #192b4010}.event h3{margin:0 0 10px;font-size:16px}.tag{background:#eaf1fb;color:#365f99;border-radius:5px;padding:3px 7px;margin-right:8px}.pictures{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.pictures img{width:150px;height:120px;object-fit:contain;background:#f4f6f9;border-radius:6px;cursor:zoom-in}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 18px;font-size:13px}.field{padding:5px 0;border-bottom:1px solid #f1f3f6;overflow-wrap:anywhere}.field b{color:#607188;font-weight:500}.changed{background:#fff6d9}.notice{font-size:13px;color:#64748b;line-height:1.7}.badge{color:#a45d0c}.load{padding:10px;color:#6a7889}a{co .pictures button{padding:0;border:0;background:none;cursor:zoom-in}.pictures img,.item img{background:#fff}.pictures button:focus-visible{outline:2px solid #85b9ff}
  #modal { position:fixed;inset:0;height:100dvh;background:#05070bf2;display:none;z-index:10;padding:clamp(.6rem,1.5vw,1.25rem);overflow:hidden;overscroll-behavior:none; }

  .modal-title { color:#fff;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; } .modal-meta { color:#aeb9c8;font-size:.82rem; }

</style></head><body><header><h1>商品历史</h1><p>按货号追踪 Git 中记录的商品字段和图片</p></header><div class="layout"><aside><input id="search" type="search" placeholder="搜索商品、货号、历史字段…"><select id="year-filter"><option value="">全部年份</option></select><select id="team-filter"><option value="">全部车队</option></select><select id="brand-filter"><option value="">全部厂商</option></select><select id="gp-filter" disabled><option value="">先选择年份</option></select><select id="type-filter" title="按商品最新一条历史记录筛选"><option value="">全部更新类型（最新记录）</option><option value="added">新增商品</option><option value="changed">商品更新</option><option value="removed">商品下架</option></select><select id="scale-filter"><option value="">全部比例</option></select><div class="sort-row"><select id="sort"><option value="">默认排序</option><option value="gp">大奖赛排序</option><option value="team">车队排序</option><option value="name">商品名称排序</option><option value="product-number">货号排序</option><option value="scale">比例排序</option><option value="type">更新类型排序</option></select><button id="sort-order" type="button" data-order="asc" title="升序" aria-label="切换升降序">↑</button><button id="clear-filters" type="button" title="清除筛选和排序" aria-label="清除筛选和排序">×</button></div><div id="count" class="muted">正在加载…</div><div id="list"></div><div id="more" class="load"></div></aside><main id="detail"><div class="empty">选择左侧商品，查看从首次记录到最新的变化。</div></main></div><div id="modal" role="dialog" aria-modal="true" aria-label="查看商品图片" aria-hidden="true"><div class="modal-top"><div class="modal-heading"><span class="modal-title" id="modal-title"></span><span class="modal-meta" id="modal-meta"></span></div><button class="close" type="button" aria-label="关闭大图">关闭 ×</button></div><div class="stage"><button class="nav" type="button" data-step="-1" aria-label="上一张图片">‹</button><img id="modal-image" alt="商品图片"><button class="nav" type="button" data-step="1" aria-label="下一张图片">›</button></div><div id="modal-thumbs"></div></div><script>
const $=id=>document.getElementById(id); let items=[], shown=0, filtered=[], active='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const image=(rev,path)=>'/image?rev='+encodeURIComponent(rev)+'&path='+encodeURIComponent(path);
const teams=[['Alpine',/alpine/i],['Aston Martin',/aston martin/i],['Audi',/\baudi\b/i],['Cadillac',/cadillac/i],['Ferrari',/\bferrari\b/i],['Haas',/\bhaas\b/i],['McLaren',/mclaren/i],['Mercedes',/mercedes/i],['Racing Bulls',/racing bulls|alphatauri|\bvcarb\b|visa cash app rb/i],['Red Bull',/red bull/i],['Sauber',/sauber/i],['Williams',/williams/i],['Lotus',/lotus/i],['Tyrrell',/tyrrell/i],['Brabham',/brabham/i],['Benetton',/benetton/i],['Renault',/renault/i]];
const gpAliases=[['Preseason',/\bpre[- ]?season\b|\btesting\b|\bshakedown\b/i],['United States GP',/\bAUSTIN\s+GP\b/i],['Australian GP',/\b(?:Australia|Australian|AU|AUS)\s+GP\b/i],['Chinese GP',/\b(?:China|Chinese|CN)(?:\s+GP)?\s+(?:Sprint\s+Race|Sprint)\b|\b(?:China|Chinese|CN)\s+GP\b/i],['Japanese GP',/\b(?:Japan|Japanese)\s+GP\b/i],['Bahrain GP',/\bBahrain\s+GP\b/i],['Saudi Arabian GP',/\bSaudi(?: Arabian)?\s+GP\b/i],['Miami GP',/\bMiami\s+GP\b/i],['Emilia-Romagna GP',/\bEmilia[- ]Romagna\s+GP\b/i],['Monaco GP',/\bMonaco\s+GP\b/i],['Spanish GP',/\b(?:Spain|Spanish|Madrid)\s+GP\b/i],['Canadian GP',/\b(?:Canada|Canadian|CAN)\s+GP\b/i],['Austrian GP',/\b(?:Austria|Austrian)\s+GP\b/i],['British GP',/\b(?:Great Britain|British)\s+GP\b|\bSilverstone(?:\s+GP)?\b/i],['Belgian GP',/\b(?:Belgium|Belgian)\s+GP\b/i],['Hungarian GP',/\b(?:Hungary|Hungarian)\s+GP\b/i],['Dutch GP',/\b(?:Netherlands|Dutch)\s+GP\b|\bZandvoort(?:\s+GP)?\b/i],['Italian GP',/\b(?:Italy|Italian|Monza)\s+GP\b/i],['Azerbaijan GP',/\bAzerbaijan\s+GP\b/i],['Singapore GP',/\bSingapore\s+GP\b/i],['United States GP',/\b(?:United States|USA|US)\s+GP\b/i],['Mexico City GP',/\b(?:Mexico City|Mexico|Mexican)\s+GP\b/i],['São Paulo GP',/\b(?:São Paulo|Sao Paulo|Brazil|Brazilian)\s+GP\b/i],['Las Vegas GP',/\bLas Vegas\s+GP\b/i],['Qatar GP',/\bQatar\s+GP\b/i],['Abu Dhabi GP',/\bAbu Dhabi\s+GP\b/i],['Catalunya GP',/\b(?:Barcelona-)?Catalunya\s+GP\b/i]];
const gpSchedules={'2025':['Preseason','Australian GP','Chinese GP','Japanese GP','Bahrain GP','Saudi Arabian GP','Miami GP','Emilia-Romagna GP','Monaco GP','Spanish GP','Canadian GP','Austrian GP','British GP','Belgian GP','Hungarian GP','Dutch GP','Italian GP','Azerbaijan GP','Singapore GP','United States GP','Mexico City GP','São Paulo GP','Las Vegas GP','Qatar GP','Abu Dhabi GP'],'2026':['Preseason','Australian GP','Chinese GP','Japanese GP','Miami GP','Canadian GP','Monaco GP','Catalunya GP','Austrian GP','British GP','Belgian GP','Hungarian GP','Dutch GP','Italian GP','Spanish GP','Azerbaijan GP','Bahrain GP','Singapore GP','United States GP','Mexico City GP','São Paulo GP','Las Vegas GP','Qatar GP','Abu Dhabi GP']};
function entryYear(entry){return String((entry.name||'').match(/\b20\d{2}\b/)?.[0]||'')}
function entryTeam(entry){return teams.find(([,rule])=>rule.test(entry.name||''))?.[0]||'其他'}
function entryGp(entry){const name=entry.name||'';if(entryYear(entry)==='2026'&&(String(entry.id||'').startsWith('minichamps-')||/Racing Bulls/i.test(name))&&/\b(?:Spain|Spanish)\s+GP\b/i.test(name))return 'Catalunya GP';return gpAliases.find(([,rule])=>rule.test(name))?.[0]||'OTHERS'}
function entryBrand(entry){if(entry.brand)return entry.brand;const id=String(entry.id||'').toLowerCase(),url=String(entry.url||'').toLowerCase();if(id.startsWith('minichamps-')||url.includes('minichamps.de'))return 'Minichamps';if(id.startsWith('looksmart-')||url.includes('looksmartmodels.com'))return 'Looksmart';if(id.startsWith('spark-')||url.includes('sparkmodel'))return 'Spark';return '其他'}
function compareEntry(a,b,by){if(by==='gp'){const yearCompare=entryYear(a.entry).localeCompare(entryYear(b.entry));if(yearCompare)return yearCompare;const order=gpSchedules[entryYear(a.entry)]||[],aGp=entryGp(a.entry),bGp=entryGp(b.entry),aIndex=order.indexOf(aGp),bIndex=order.indexOf(bGp);return (aIndex<0?order.length:aIndex)-(bIndex<0?order.length:bIndex)||aGp.localeCompare(bGp,'zh-CN')}if(by==='team')return entryTeam(a.entry).localeCompare(entryTeam(b.entry),'zh-CN');if(by==='name')return (a.entry.name||'').localeCompare(b.entry.name||'','zh-CN');if(by==='product-number')return (a.entry.product_number||'').localeCompare(b.entry.product_number||'','zh-CN',{numeric:true});if(by==='scale')return Number(a.entry.scale?.split('/')[1]||0)-Number(b.entry.scale?.split('/')[1]||0);if(by==='type')return ({added:0,changed:1,removed:2}[a.entry.type]??3)-({added:0,changed:1,removed:2}[b.entry.type]??3);return a.index-b.index}

function setupFilters(){const values=(id,arr)=>$(id).insertAdjacentHTML('beforeend',arr.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(''));const unique=arr=>[...new Set(arr.filter(Boolean))];values('year-filter',unique(items.map(entryYear)).sort((a,b)=>Number(b)-Number(a)));values('team-filter',unique(items.map(entryTeam)).sort((a,b)=>a.localeCompare(b,'zh-CN')));values('brand-filter',unique(items.map(entryBrand)).sort((a,b)=>a.localeCompare(b,'zh-CN')));values('scale-filter',unique(items.map(x=>x.scale)).sort((a,b)=>Number(b.split('/')[1]||0)-Number(a.split('/')[1]||0)))}
function rebuildGp(){const year=$('year-filter').value, el=$('gp-filter');if(!year){el.innerHTML='<option value="">先选择年份</option>';el.disabled=true;return}const available=new Set(items.filter(x=>entryYear(x)===year).map(entryGp)),schedule=gpSchedules[year]||[],ordered=[...schedule.filter(x=>available.has(x)),...[...available].filter(x=>x!=='OTHERS'&&!schedule.includes(x)).sort((a,b)=>a.localeCompare(b,'zh-CN')),...(available.has('OTHERS')?['OTHERS']:[])];el.innerHTML='<option value="">全部大奖赛</option>'+ordered.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');el.disabled=false}
function refresh(){const q=$('search').value.trim().toLocaleLowerCase('zh-CN'), year=$('year-filter').value,team=$('team-filter').value,brand=$('brand-filter').value,gp=$('gp-filter').value,type=$('type-filter').value,scale=$('scale-filter').value,sort=$('sort').value,desc=$('sort-order').dataset.order==='desc';filtered=items.map((entry,index)=>({entry,index})).filter(({entry:x})=>(!q||(x.key+' '+x.search_text).toLocaleLowerCase('zh-CN').includes(q))&&(!year||entryYear(x)===year)&&(!team||entryTeam(x)===team)&&(!brand||entryBrand(x)===brand)&&(!gp||entryGp(x)===gp)&&(!type||x.type===type)&&(!scale||x.scale===scale)).sort((a,b)=>{const result=compareEntry(a,b,sort);return (desc?-result:result)||a.index-b.index}).map(x=>x.entry);shown=0;$('list').innerHTML='';$('count').textContent=`${filtered.length} 件商品`+(type?' · 按最新记录类型':'');more()}
function more(){let part=filtered.slice(shown,shown+100); $('list').insertAdjacentHTML('beforeend',part.map(x=>`<div class="item ${x.key===active?'active':''}" data-key="${esc(x.key)}">${x.image?`<img loading="lazy" src="${image(x.commit,x.image)}" onerror="this.style.visibility='hidden'">`:''}<div><strong>${esc(x.key)} ${x.removed?'<small class="badge">已移除</small>':''}</strong><span>${esc(x.name)}</span><span>${esc(x.brand)} · ${x.count} 条记录${x.duplicates>1?' · 同货号多条':''}</span></div></div>`).join(''));shown+=part.length;$('more').innerHTML=shown<filtered.length?`<button id="loadMore">加载更多（${filtered.length-shown}）</button>`:'';if($('loadMore'))$('loadMore').onclick=more}
$('list').onclick=e=>{let el=e.target.closest('.item');if(el) select(el.dataset.key)}; $('search').oninput=refresh;['team-filter','brand-filter','gp-filter','type-filter','scale-filter','sort'].forEach(id=>$(id).onchange=refresh);$('year-filter').onchange=()=>{rebuildGp();refresh()};$('sort-order').onclick=()=>{const b=$('sort-order');b.dataset.order=b.dataset.order==='asc'?'desc':'asc';b.textContent=b.dataset.order==='asc'?'↑':'↓';b.title=b.dataset.order==='asc'?'升序':'降序';refresh()};$('clear-filters').onclick=()=>{['search','year-filter','team-filter','brand-filter','type-filter','scale-filter','sort'].forEach(id=>$(id).value='');rebuildGp();const b=$('sort-order');b.dataset.order='asc';b.textContent='↑';b.title='升序';refresh()};
function fields(p){let out={};for(const [k,v] of Object.entries(p)){if(k==='images'||k==='properties')continue;out[k]=v}for(const [k,v] of Object.entries(p.properties||{}))out['properties.'+k]=v;return out}
function val(v){return typeof v==='object'?JSON.stringify(v):String(v??'')}
async function select(key){active=key;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.key===key));$('detail').innerHTML='<div class="empty">正在加载历史…</div>';let events=await (await fetch('/api/history?key='+encodeURIComponent(key))).json(); if(active!==key)return;let html=`<div class="summary"><h2>${esc(key)}</h2><div class="notice">按时间从早到晚排列。黄色字段表示相对上一条记录发生变化；图片为该版本保存的文件。记录时间为 Git 提交时间，并非商品实际上架或变更的确切时间。</div></div>`;events.forEach((e,i)=>{let prev=events[i-1];html+=`<section class="event"><h3><span class="tag">${esc(e.reason)}</span>${esc(e.date?e.date.replace('T',' '):'当前工作区')} <span class="muted">${esc(e.commit==='WORKTREE'?'未提交':e.commit.slice(0,8))}</span></h3>`;if(!e.products.length){html+='<p class="muted">此版本的目录中没有该货号。</p>'}e.products.forEach((p,j)=>{let previous=prev?.products?.find(x=>x.id===p.id)||prev?.products?.[j];let old=previous?fields(previous):{};let f=fields(p);html+=`${e.products.length>1?`<h4>同货号记录 ${j+1} · ${esc(p.id)}</h4>`:''}<div class="pictures">${(p.images||[]).map(path=>`<button type="button" class="picture" data-source="${esc(image(e.commit,path))}" aria-label="查看大图"><img loading="lazy" src="${esc(image(e.commit,path))}" alt="商品图片" onerror="this.alt='图片未保存'"></button>`).join('')}</div><div class="fields">${Object.entries(f).map(([k,v])=>`<div class="field ${previous&&val(old[k])!==val(v)?'changed':''}"><b>${esc(k)}：</b>${esc(val(v))}</div>`).join('')}${Object.keys(old).filter(k=>!(k in f)).map(k=>`<div class="field changed"><b>${esc(k)}：</b>（已删除）</div>`).join('')}</div>`});html+='</section>'});$('detail').innerHTML=html}
fetch('/api/list').then(r=>r.json()).then(d=>{items=d.items.sort((a,b)=>a.key.localeCompare(b.key,undefined,{numeric:true}));setupFilters();refresh()}).catch(()=>$('count').textContent='加载失败，请检查启动窗口。');

const modal=document.querySelector('#modal'),modalImage=document.querySelector('#modal-image'),modalThumbs=document.querySelector('#modal-thumbs');
let gallery={buttons:[],index:0,scale:1,x:0,y:0,dragging:false,swiping:false},returnFocus=null;
function applyView(){modalImage.style.transform=`translate(${gallery.x}px,${gallery.y}px) scale(${gallery.scale})`;modalImage.classList.toggle('dragging',gallery.dragging)}
function resetView(){Object.assign(gallery,{scale:1,x:0,y:0,dragging:false,swiping:false});applyView()}
function constrainPan(){const clamp=(value,limit)=>Math.max(-limit,Math.min(limit,value));gallery.x=clamp(gallery.x,modalImage.offsetWidth*gallery.scale/2);gallery.y=clamp(gallery.y,modalImage.offsetHeight*gallery.scale/2)}
function showImage(){const button=gallery.buttons[gallery.index];if(!button)return;modalImage.src=button.dataset.source;modalImage.alt=button.querySelector('img')?.alt||'更新图片';document.querySelector('#modal-meta').textContent=`${'商品图片'} · 图片 ${gallery.index+1} / ${gallery.buttons.length}`;modalThumbs.innerHTML=gallery.buttons.map((item,index)=>`<button type="button" data-index="${index}" class="${index===gallery.index?'active':''}" aria-label="查看第 ${index+1} 张图片"><img src="${esc(item.dataset.source)}" alt="${index+1}"></button>`).join('');modal.querySelectorAll('[data-step]').forEach(item=>item.disabled=gallery.buttons.length<2);resetView()}
function openGallery(button){const card=button.closest('.event');gallery.buttons=[...button.parentElement.querySelectorAll('.picture')];gallery.index=gallery.buttons.indexOf(button);document.querySelector('#modal-title').textContent=active+' · '+(card.querySelector('h3')?.textContent||'商品图片');returnFocus=button;modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');showImage();modal.querySelector('.close').focus()}
function closeGallery(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');returnFocus?.focus()}
function moveImage(step){if(gallery.buttons.length<2)return;gallery.index=(gallery.index+step+gallery.buttons.length)%gallery.buttons.length;showImage()}
$('detail').addEventListener('click',event=>{const button=event.target.closest('.picture');if(button)openGallery(button)});
modal.addEventListener('click',event=>{if(event.target.closest('.close')){closeGallery();return}const nav=event.target.closest('[data-step]');if(nav){moveImage(Number(nav.dataset.step));return}const thumb=event.target.closest('#modal-thumbs [data-index]');if(thumb){gallery.index=Number(thumb.dataset.index);showImage();return}if(event.target===modal)closeGallery()});
modal.querySelector('.stage').addEventListener('wheel',event=>{event.preventDefault();gallery.scale=Math.max(1,Math.min(8,gallery.scale*(event.deltaY<0?1.12:.89)));if(gallery.scale===1)gallery.x=gallery.y=0;constrainPan();applyView()},{passive:false});
modalImage.addEventListener('pointerdown',event=>{if(event.pointerType==='touch'&&gallery.scale===1){Object.assign(gallery,{swiping:true,swipeX:event.clientX,swipeY:event.clientY});modalImage.setPointerCapture(event.pointerId);return}if(gallery.scale===1||(event.pointerType==='mouse'&&event.button!==0))return;gallery.dragging=true;gallery.startX=event.clientX-gallery.x;gallery.startY=event.clientY-gallery.y;modalImage.setPointerCapture(event.pointerId);applyView()});
modalImage.addEventListener('pointermove',event=>{if(!gallery.dragging)return;gallery.x=event.clientX-gallery.startX;gallery.y=event.clientY-gallery.startY;constrainPan();applyView()});
function stopPointer(event){if(gallery.swiping){const dx=event.clientX-gallery.swipeX,dy=event.clientY-gallery.swipeY;gallery.swiping=false;if(modalImage.hasPointerCapture(event.pointerId))modalImage.releasePointerCapture(event.pointerId);if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy))moveImage(dx<0?1:-1);return}if(!gallery.dragging)return;gallery.dragging=false;if(modalImage.hasPointerCapture(event.pointerId))modalImage.releasePointerCapture(event.pointerId);applyView()}
modalImage.addEventListener('pointerup',stopPointer);modalImage.addEventListener('pointercancel',stopPointer);
modalImage.addEventListener('dblclick',()=>{gallery.scale=gallery.scale===1?2:1;if(gallery.scale===1)gallery.x=gallery.y=0;constrainPan();applyView()});
document.addEventListener('keydown',event=>{if(!modal.classList.contains('open'))return;if(event.key==='Escape')closeGallery();if(event.key==='ArrowLeft')moveImage(-1);if(event.key==='ArrowRight')moveImage(1)});
</script></body></html>
