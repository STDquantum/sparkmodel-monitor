name: Carmodel connectivity probe

on:
  pull_request:
    paths:
      - carmodel.py
      - carmodel_probe.py
      - .github/workflows/carmodel-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_carmodel -q
      - run: python carmodel_probe.py
