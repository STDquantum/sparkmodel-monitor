name: Carmodel connectivity probe

on:
  pull_request:
    paths:
      - scripts/**
      - .github/workflows/monitor.yml
      - .github/workflows/carmodel-probe.yml
  workflow_dispatch:
    inputs:
      browser:
        description: 'Also test browser transport and Chromium (diagnostic dependencies only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scripts and snapshot paths
        run: |
          python -m compileall -q scripts
          python -c "import sys; sys.path.insert(0, 'scripts'); import catalog, serve_local; assert catalog.load_snapshot()['items']; serve_local.read_times()"
      - if: github.event_name == 'workflow_dispatch' && inputs.browser
        run: pip install curl_cffi playwright
      - if: github.event_name == 'workflow_dispatch' && inputs.browser
        run: python -m playwright install --with-deps chromium
      - if: github.event_name == 'workflow_dispatch' && inputs.browser
        run: python scripts/carmodel_probe.py --browser
      - if: github.event_name == 'workflow_dispatch' && !inputs.browser
        run: python scripts/carmodel_probe.py
