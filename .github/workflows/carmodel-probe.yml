name: Carmodel connectivity probe

on:
  pull_request:
    paths:
      - carmodel.py
      - carmodel_probe.py
      - .github/workflows/carmodel-probe.yml
  workflow_dispatch:
    inputs:
      browser:
        description: 'Also test browser transport and Chromium (diagnostic dependencies only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_carmodel -q
      - if: github.event_name == 'workflow_dispatch' && inputs.browser
        run: pip install curl_cffi playwright
      - if: github.event_name == 'workflow_dispatch' && inputs.browser
        run: python -m playwright install --with-deps chromium
      - if: github.event_name == 'workflow_dispatch' && inputs.browser
        run: python carmodel_probe.py --browser
      - if: github.event_name != 'workflow_dispatch' || !inputs.browser
        run: python carmodel_probe.py
