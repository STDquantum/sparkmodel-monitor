<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<title>更新报告 · Model Shop</title>
<style>
  :root { color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#101217;color:#f5f7fa; }
  * { box-sizing:border-box; } body { margin:0; } body.modal-open { overflow:hidden; } a { color:#85b9ff; } p { color:#b9c2d0;line-height:1.5; }
  header { padding:2rem max(1rem,calc((100% - 1280px)/2));background:#171b23;position:sticky;top:0;z-index:2;box-shadow:0 2px 14px #0006; }
  .header-top { display:flex;align-items:flex-start;justify-content:space-between;gap:1rem; } h1 { margin:0 0 .35rem; } header p { margin:.35rem 0 0; }
  .backnav { display:inline-block;margin-bottom:1rem;color:#f5f7fa;text-decoration:none;font-size:.82rem;opacity:.78; } .backnav:hover,.backnav:focus-visible { color:#fff;opacity:1;text-decoration:underline; }
  .back-link { flex:none;border:1px solid #526074;border-radius:.5rem;padding:.65rem .85rem;text-decoration:none;background:#101217; } .back-link:hover { background:#263448; }
  main { max-width:1280px;margin:auto;padding:1.25rem; } .run { margin:0 0 2rem; } .run h2 { margin:1.5rem 0 1rem;font-size:1.1rem;border-bottom:1px solid #394252;padding-bottom:.6rem; }
  .entries { display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,370px),1fr));gap:1rem;align-items:stretch; }
  .entry { background:#1a1f28;border:1px solid #29313d;border-radius:.8rem;overflow:hidden;display:flex;flex-direction:column;min-width:0; }
  .entry-body { padding:1rem; } .entry h3 { font-size:1rem;margin:0 0 .45rem;line-height:1.4; } .entry h3 a { color:#f5f7fa;text-decoration:none; } .entry h3 a:hover { color:#85b9ff;text-decoration:underline; }
  .product-meta { display:flex;flex-wrap:wrap;gap:.35rem .8rem;margin:0 0 .8rem;color:#b9c2d0;font-size:.84rem; } .product-meta strong { color:#f5f7fa;font-weight:500; }
  .badge { display:inline-block;color:#fff;background:#35455d;border-radius:.3rem;padding:.13rem .4rem;margin-right:.5rem;font-size:.8rem;white-space:nowrap; }
  .badge.added { background:#24563b; } .badge.removed { background:#693a3a; } .entry p { margin:.7rem 0; } .change-list { margin:.7rem 0;padding:0;list-style:none; }
  .change-list li { border-top:1px solid #2b3441;padding:.48rem 0;overflow-wrap:anywhere;font-size:.88rem; } .field { color:#9da9ba;display:block;font-size:.8rem; } .before { color:#aeb9c8; } .after { color:#dcecff; }
  .technical { border-top:1px solid #2b3441;margin-top:.8rem;padding-top:.6rem; } .technical summary { color:#85b9ff;cursor:pointer;font-size:.85rem; } .technical summary:hover { text-decoration:underline; } .technical .change-list { margin-bottom:0; } .technical p { font-size:.85rem;overflow-wrap:anywhere; }
  .pictures { display:flex;gap:.5rem;overflow-x:auto;padding:.65rem 1rem 1rem;margin-top:auto;background:#141922;border-top:1px solid #29313d; }
  .picture { flex:0 0 112px;border:1px solid #526074;border-radius:.45rem;background:#101217;padding:0;overflow:hidden;color:#b9c2d0;cursor:zoom-in;text-align:left;font:inherit; }
  .picture:hover,.picture:focus-visible { border-color:#85b9ff;outline:none; } .picture img { width:100%;height:84px;object-fit:contain;background:#fff;display:block; } .picture span { display:block;padding:.3rem .4rem;font-size:.75rem; }
  #modal { position:fixed;inset:0;height:100dvh;background:#05070bf2;display:none;z-index:10;padding:clamp(.6rem,1.5vw,1.25rem);overflow:hidden;overscroll-behavior:none; }
  #modal.open { display:grid;grid-template-rows:auto min(70dvh,760px) auto;gap:clamp(.7rem,2vh,1.3rem) 0;place-content:center; }
  .modal-top { display:flex;align-items:center;justify-content:space-between;gap:1rem;width:min(94vw,1280px);margin:auto; } .modal-heading { min-width:0;display:grid;gap:.18rem; }
  .modal-title { color:#fff;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; } .modal-meta { color:#aeb9c8;font-size:.82rem; }
  .close,.nav { border:1px solid #6c7889;background:#1d2530;color:#fff;border-radius:.45rem;cursor:pointer;font:inherit; } .close { padding:.55rem .8rem;flex:none; }
  .stage { min-height:0;height:100%;display:grid;grid-template-columns:3.2rem minmax(0,1fr) 3.2rem;align-items:center;gap:.5rem;width:min(94vw,1280px);margin:auto;overflow:hidden; }
  .stage img { width:auto;height:auto;max-width:100%;max-height:100%;min-width:0;min-height:0;margin:auto;display:block;object-fit:contain;transform-origin:center;transition:transform .12s ease-out;cursor:grab;user-select:none;-webkit-user-drag:none;touch-action:none;will-change:transform; }
  .stage img.dragging { cursor:grabbing;transition:none; } .nav { width:3rem;height:3rem;font-size:1.7rem;z-index:1; } .nav:disabled { opacity:.35;cursor:default; }
  #modal-thumbs { display:flex;gap:.5rem;overflow-x:auto;justify-content:center;width:min(94vw,1280px);margin:auto;padding:.1rem .35rem; } #modal-thumbs button { padding:0;border:2px solid transparent;background:#fff;border-radius:.35rem;cursor:pointer;flex:0 0 auto; } #modal-thumbs button.active { border-color:#85b9ff; } #modal-thumbs img { width:70px;height:52px;object-fit:contain;display:block; }
  @media(max-width:720px) { header { position:static;padding:1.2rem; } h1 { font-size:1.3rem; } main { padding:.8rem; } #modal { padding:.55rem; } #modal.open { grid-template-rows:auto min(68dvh,600px) auto; } .modal-top { align-items:flex-start; } .modal-title { white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical; } .close { padding:.45rem .55rem;font-size:.84rem; } .stage { position:relative;width:100%;grid-template-columns:minmax(0,1fr); } .stage .nav { position:absolute;top:50%;transform:translateY(-50%);width:2.4rem;height:2.65rem; } .stage [data-step="-1"] { left:0; } .stage [data-step="1"] { right:0; } #modal-thumbs { justify-content:flex-start; } }
</style>
<header><a class="backnav" href="https://stdquantum.github.io/F1/index.html">← 返回导航</a><div class="header-top"><div><h1>Model Shop · Formula 1</h1><p>更新报告 · 商品、字段与图片变化</p></div><a class="back-link" href="index.html">← 返回商品目录</a></div></header>
<main id="report"><p>正在载入更新记录…</p></main>
<div id="modal" role="dialog" aria-modal="true" aria-label="查看更新图片" aria-hidden="true"><div class="modal-top"><div class="modal-heading"><a class="modal-title" id="modal-link" target="_blank" rel="noreferrer"></a><span class="modal-meta" id="modal-meta"></span></div><button class="close" type="button" aria-label="关闭大图">关闭 ×</button></div><div class="stage"><button class="nav" type="button" data-step="-1" aria-label="上一张图片">‹</button><img id="modal-image" alt="更新图片"><button class="nav" type="button" data-step="1" aria-label="下一张图片">›</button></div><div id="modal-thumbs"></div></div>
<script src="updates.js"></script>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const label={added:'新增商品',changed:'商品更新',removed:'商品下架'};
function renderEntry(entry){
  const images=entry.images||{},pictures=[...(images.added||[]).map(path=>({path,kind:'新增图片'})),...(images.changed||[]).map(path=>({path,kind:'替换图片'}))];
  const fieldRow=item=>`<li><span class="field">${esc(item.field)}</span><span class="before">${esc(item.before)||'无'}</span> → <span class="after">${esc(item.after)||'无'}</span></li>`;
  const fields=(entry.fields||[]).filter(item=>item.field!=='封面链接').map(fieldRow).join('');
  const coverFields=(entry.fields||[]).filter(item=>item.field==='封面链接').map(fieldRow).join('');
  const counts=entry.image_counts||{added:images.added?.length||0,changed:images.changed?.length||0};
  const missing=counts.added+counts.changed-pictures.length;
  const imageNotes=[counts.added?`实新增 ${counts.added} 张图片`:'',counts.changed?`替换 ${counts.changed} 张图片`:'',images.removed_count?`移除 ${images.removed_count} 张图片`:'',missing?`${missing} 张历史图片已变化，预览已移除`:''].filter(Boolean);
  const moved=images.moved?.length?`<p>原有图片位置：${images.moved.map(item=>`${item.from} → ${item.to}`).join('、')}</p>`:'';
  const pictureFiles=['新增图片','替换图片'].map(kind=>{const names=pictures.filter(item=>item.kind===kind).map(item=>item.path.split('/').pop());return names.length?`<li><span class="field">${kind}文件</span><span class="after">${names.map(esc).join('<br>')}</span></li>`:''}).join('');
  const technical=coverFields||moved||pictureFiles?`<details class="technical"><summary>查看细节</summary>${coverFields?`<ul class="change-list">${coverFields}</ul>`:''}${pictureFiles?`<ul class="change-list">${pictureFiles}</ul>`:''}${moved}</details>`:'';
  const meta=[entry.product_number?`<span>货号 <strong>${esc(entry.product_number)}</strong></span>`:'',entry.scale?`<span>比例 <strong>${esc(entry.scale)}</strong></span>`:''].filter(Boolean).join('');
  return `<article class="entry"><div class="entry-body"><h3><span class="badge ${esc(entry.type)}">${label[entry.type]||'更新'}</span>${entry.url?`<a href="${esc(entry.url)}" target="_blank" rel="noreferrer">${esc(entry.name)}</a>`:esc(entry.name)}</h3>${meta?`<div class="product-meta">${meta}</div>`:''}${fields?`<ul class="change-list">${fields}</ul>`:''}${imageNotes.length?`<p>${imageNotes.join(' · ')}</p>`:''}${technical}</div>${pictures.length?`<div class="pictures">${pictures.map(({path,kind},index)=>`<button class="picture" type="button" data-source="${esc(path)}" aria-label="放大查看${kind}第 ${index+1} 张"><img src="${esc(path)}" alt="${esc(kind)}" loading="lazy"><span>${kind} · ${index+1}</span></button>`).join('')}</div>`:''}</article>`;
}
function renderReport(data){
  const runs=data.updates||[];
  document.querySelector('#report').innerHTML=runs.length?'<p>历史图片在原文件内容未变化时保留，点击图片可放大查看。</p>'+runs.map(run=>`<section class="run"><h2>${esc(new Date(run.date).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}))}（北京时间） · ${run.entries.length} 项商品</h2><div class="entries">${run.entries.map(renderEntry).join('')}</div></section>`).join(''):'<p>还没有更新记录。下一次商品变化后会自动生成报告。</p>';
}
if(window.MODEL_UPDATES&&Array.isArray(window.MODEL_UPDATES.updates))renderReport(window.MODEL_UPDATES);
else fetch(`updates.json?v=${Date.now()}`,{cache:'no-store'}).then(response=>{if(!response.ok)throw Error();return response.json()}).then(renderReport).catch(()=>document.querySelector('#report').innerHTML='<p>无法载入更新报告。请确认 updates.js 和 updates.json 与本页面位于同一目录。</p>');
const report=document.querySelector('#report'),modal=document.querySelector('#modal'),modalImage=document.querySelector('#modal-image'),modalThumbs=document.querySelector('#modal-thumbs');
let gallery={buttons:[],index:0,scale:1,x:0,y:0,dragging:false,swiping:false},returnFocus=null;
function applyView(){modalImage.style.transform=`translate(${gallery.x}px,${gallery.y}px) scale(${gallery.scale})`;modalImage.classList.toggle('dragging',gallery.dragging)}
function resetView(){Object.assign(gallery,{scale:1,x:0,y:0,dragging:false,swiping:false});applyView()}
function constrainPan(){const clamp=(value,limit)=>Math.max(-limit,Math.min(limit,value));gallery.x=clamp(gallery.x,modalImage.offsetWidth*gallery.scale/2);gallery.y=clamp(gallery.y,modalImage.offsetHeight*gallery.scale/2)}
function showImage(){const button=gallery.buttons[gallery.index];if(!button)return;modalImage.src=button.dataset.source;modalImage.alt=button.querySelector('img')?.alt||'更新图片';document.querySelector('#modal-meta').textContent=`${button.querySelector('span')?.textContent||''} · 图片 ${gallery.index+1} / ${gallery.buttons.length}`;modalThumbs.innerHTML=gallery.buttons.map((item,index)=>`<button type="button" data-index="${index}" class="${index===gallery.index?'active':''}" aria-label="查看第 ${index+1} 张图片"><img src="${esc(item.dataset.source)}" alt="${index+1}"></button>`).join('');modal.querySelectorAll('[data-step]').forEach(item=>item.disabled=gallery.buttons.length<2);resetView()}
function openGallery(button){const card=button.closest('.entry');gallery.buttons=[...card.querySelectorAll('.picture')];gallery.index=gallery.buttons.indexOf(button);const link=card.querySelector('h3 a'),modalLink=document.querySelector('#modal-link');modalLink.textContent=link?.textContent||card.querySelector('h3')?.textContent||'更新图片';modalLink.href=link?.href||'#';modalLink.hidden=!link;returnFocus=button;modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');showImage();modal.querySelector('.close').focus()}
function closeGallery(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');returnFocus?.focus()}
function moveImage(step){if(gallery.buttons.length<2)return;gallery.index=(gallery.index+step+gallery.buttons.length)%gallery.buttons.length;showImage()}
report.addEventListener('click',event=>{const button=event.target.closest('.picture');if(button)openGallery(button)});
modal.addEventListener('click',event=>{if(event.target.closest('.close')){closeGallery();return}const nav=event.target.closest('[data-step]');if(nav){moveImage(Number(nav.dataset.step));return}const thumb=event.target.closest('#modal-thumbs [data-index]');if(thumb){gallery.index=Number(thumb.dataset.index);showImage();return}if(event.target===modal)closeGallery()});
modal.querySelector('.stage').addEventListener('wheel',event=>{event.preventDefault();gallery.scale=Math.max(1,Math.min(8,gallery.scale*(event.deltaY<0?1.12:.89)));if(gallery.scale===1)gallery.x=gallery.y=0;constrainPan();applyView()},{passive:false});
modalImage.addEventListener('pointerdown',event=>{if(event.pointerType==='touch'&&gallery.scale===1){Object.assign(gallery,{swiping:true,swipeX:event.clientX,swipeY:event.clientY});modalImage.setPointerCapture(event.pointerId);return}if(gallery.scale===1||(event.pointerType==='mouse'&&event.button!==0))return;gallery.dragging=true;gallery.startX=event.clientX-gallery.x;gallery.startY=event.clientY-gallery.y;modalImage.setPointerCapture(event.pointerId);applyView()});
modalImage.addEventListener('pointermove',event=>{if(!gallery.dragging)return;gallery.x=event.clientX-gallery.startX;gallery.y=event.clientY-gallery.startY;constrainPan();applyView()});
function stopPointer(event){if(gallery.swiping){const dx=event.clientX-gallery.swipeX,dy=event.clientY-gallery.swipeY;gallery.swiping=false;if(modalImage.hasPointerCapture(event.pointerId))modalImage.releasePointerCapture(event.pointerId);if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy))moveImage(dx<0?1:-1);return}if(!gallery.dragging)return;gallery.dragging=false;if(modalImage.hasPointerCapture(event.pointerId))modalImage.releasePointerCapture(event.pointerId);applyView()}
modalImage.addEventListener('pointerup',stopPointer);modalImage.addEventListener('pointercancel',stopPointer);
modalImage.addEventListener('dblclick',()=>{gallery.scale=gallery.scale===1?2:1;if(gallery.scale===1)gallery.x=gallery.y=0;constrainPan();applyView()});
document.addEventListener('keydown',event=>{if(!modal.classList.contains('open'))return;if(event.key==='Escape')closeGallery();if(event.key==='ArrowLeft')moveImage(-1);if(event.key==='ArrowRight')moveImage(1)});
</script>
</html>
