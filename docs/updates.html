<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const label={added:'新增商品',changed:'商品更新',removed:'商品下架'};
function renderEntry(entry,anchorId){
  const images=entry.images||{},pictures=[...(images.added||[]).map(path=>({path,kind:'新增图片'})),...(images.changed||[]).map(path=>({path,kind:'替换图片'}))];
  const fieldRow=item=>`<li><span class="field">${esc(item.field)}</span><span class="before">${esc(item.before)||'无'}</span> → <span class="after">${esc(item.after)||'无'}</span></li>`;
  const fields=(entry.fields||[]).filter(item=>item.field!=='封面链接').map(fieldRow).join('');
  const coverFields=(entry.fields||[]).filter(item=>item.field==='封面链接').map(fieldRow).join('');
  const counts=entry.image_counts||{added:images.added?.length||0,changed:images.changed?.length||0};
  const missing=counts.added+counts.changed-pictures.length;
  const imageNotes=[counts.added?`实新增 ${counts.added} 张图片`:'',counts.changed?`替换 ${counts.changed} 张图片`:'',images.removed_count?`移除 ${images.removed_count} 张图片`:'',missing?`${missing} 张历史图片已变化，预览已移除`:''].filter(Boolean);
  const moved=images.moved?.length?`<p>原有图片位置：${images.moved.map(item=>`${item.from} → ${item.to}`).join('、')}</p>`:'';
  const pictureFiles=['新增图片','替换图片'].map(kind=>{const names=pictures.filter(item=>item.kind===kind).map(item=>item.path.split('/').pop());return names.length?`<li><span class="field">${kind}文件</span><span class="after">${names.map(esc).join('<br>')}</span></li>`:''}).join('');
  const technical=coverFields||moved||pictureFiles?`<details class="technical"><summary>查看细节</summary>${coverFields?`<ul class="change-list">${coverFields}</ul>`:''}${pictureFiles?`<ul class="change-list">${pictureFiles}</ul>`:''}${moved}</details>`:'';
  const meta=[entry.product_number?`<span>货号 <strong>${esc(entry.product_number)}</strong></span>`:'',entry.scale?`<span>比例 <strong>${esc(entry.scale)}</strong></span>`:''].filter(Boolean).join('');
  const locateLink=entry.id&&entry.type!=='removed'?`<div class="entry-actions"><a class="locate-link" href="index.html?product=${encodeURIComponent(entry.id)}&return=${encodeURIComponent(`updates.html#${anchorId}`)}">定位商品 →</a></div>`:'';
  return `<article class="entry" id="${esc(anchorId)}"><div class="entry-body"><h3><span class="badge ${esc(entry.type)}">${label[entry.type]||'更新'}</span>${entry.url?`<a href="${esc(entry.url)}" target="_blank" rel="noreferrer">${esc(entry.name)}</a>`:esc(entry.name)}</h3>${meta?`<div class="product-meta">${meta}</div>`:''}${locateLink}${fields?`<ul class="change-list">${fields}</ul>`:''}${imageNotes.length?`<p>${imageNotes.join(' · ')}</p>`:''}${technical}</div>${pictures.length?`<div class="pictures">${pictures.map(({path,kind},index)=>`<button class="picture" type="button" data-source="${esc(path)}" aria-label="放大查看${kind}第 ${index+1} 张"><img src="${esc(path)}" alt="${esc(kind)}" loading="lazy"><span>${kind} · ${index+1}</span></button>`).join('')}</div>`:''}</article>`;
}
function formatRunDate(date,options={}){
  const value=new Date(date);
  if(Number.isNaN(value.getTime()))return String(date||'未知分组');
  return value.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:options.compact?'2-digit':'long',day:options.compact?'2-digit':'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
}
const report=document.querySelector('#report'),tocList=document.querySelector('#toc-list'),search=document.querySelector('#search'),typeFilter=document.querySelector('#type-filter'),yearFilter=document.querySelector('#year-filter'),teamFilter=document.querySelector('#team-filter'),brandFilter=document.querySelector('#brand-filter'),gpFilter=document.querySelector('#gp-filter'),scaleFilter=document.querySelector('#scale-filter'),sortSelect=document.querySelector('#sort'),sortOrder=document.querySelector('#sort-order'),count=document.querySelector('#count'),catalogById=new Map((window.MODEL_CATALOG?.products||[]).map(product=>[String(product.id),product]));
let reportRuns=[];
const teams=[['Alpine',/alpine/i],['Aston Martin',/aston martin/i],['Audi',/\baudi\b/i],['Cadillac',/cadillac/i],['Ferrari',/\bferrari\b/i],['Haas',/\bhaas\b/i],['McLaren',/mclaren/i],['Mercedes',/mercedes/i],['Racing Bulls',/racing bulls|alphatauri|\bvcarb\b|visa cash app rb/i],['Red Bull',/red bull/i],['Sauber',/sauber/i],['Williams',/williams/i],['Lotus',/lotus/i],['Tyrrell',/tyrrell/i],['Brabham',/brabham/i],['Benetton',/benetton/i],['Renault',/renault/i]];
const gpAliases=[['Preseason',/\bpre[- ]?season\b|\btesting\b|\bshakedown\b/i],['United States GP',/\bAUSTIN\s+GP\b/i],['Australian GP',/\b(?:Australia|Australian|AU|AUS)\s+GP\b/i],['Chinese GP',/\b(?:China|Chinese|CN)(?:\s+GP)?\s+(?:Sprint\s+Race|Sprint)\b|\b(?:China|Chinese|CN)\s+GP\b/i],['Japanese GP',/\b(?:Japan|Japanese)\s+GP\b/i],['Bahrain GP',/\bBahrain\s+GP\b/i],['Saudi Arabian GP',/\bSaudi(?: Arabian)?\s+GP\b/i],['Miami GP',/\bMiami\s+GP\b/i],['Emilia-Romagna GP',/\bEmilia[- ]Romagna\s+GP\b/i],['Monaco GP',/\bMonaco\s+GP\b/i],['Spanish GP',/\b(?:Spain|Spanish|Madrid)\s+GP\b/i],['Canadian GP',/\b(?:Canada|Canadian|CAN)\s+GP\b/i],['Austrian GP',/\b(?:Austria|Austrian)\s+GP\b/i],['British GP',/\b(?:Great Britain|British)\s+GP\b|\bSilverstone(?:\s+GP)?\b/i],['Belgian GP',/\b(?:Belgium|Belgian)\s+GP\b/i],['Hungarian GP',/\b(?:Hungary|Hungarian)\s+GP\b/i],['Dutch GP',/\b(?:Netherlands|Dutch)\s+GP\b|\bZandvoort(?:\s+GP)?\b/i],['Italian GP',/\b(?:Italy|Italian|Monza)\s+GP\b/i],['Azerbaijan GP',/\bAzerbaijan\s+GP\b/i],['Singapore GP',/\bSingapore\s+GP\b/i],['United States GP',/\b(?:United States|USA|US)\s+GP\b/i],['Mexico City GP',/\b(?:Mexico City|Mexico|Mexican)\s+GP\b/i],['São Paulo GP',/\b(?:São Paulo|Sao Paulo|Brazil|Brazilian)\s+GP\b/i],['Las Vegas GP',/\bLas Vegas\s+GP\b/i],['Qatar GP',/\bQatar\s+GP\b/i],['Abu Dhabi GP',/\bAbu Dhabi\s+GP\b/i],['Catalunya GP',/\b(?:Barcelona-)?Catalunya\s+GP\b/i]];
const gpSchedules={'2025':['Preseason','Australian GP','Chinese GP','Japanese GP','Bahrain GP','Saudi Arabian GP','Miami GP','Emilia-Romagna GP','Monaco GP','Spanish GP','Canadian GP','Austrian GP','British GP','Belgian GP','Hungarian GP','Dutch GP','Italian GP','Azerbaijan GP','Singapore GP','United States GP','Mexico City GP','São Paulo GP','Las Vegas GP','Qatar GP','Abu Dhabi GP'],'2026':['Preseason','Australian GP','Chinese GP','Japanese GP','Miami GP','Canadian GP','Monaco GP','Catalunya GP','Austrian GP','British GP','Belgian GP','Hungarian GP','Dutch GP','Italian GP','Spanish GP','Azerbaijan GP','Bahrain GP','Singapore GP','United States GP','Mexico City GP','São Paulo GP','Las Vegas GP','Qatar GP','Abu Dhabi GP']};
function entryYear(entry){return String((entry.name||'').match(/\b20\d{2}\b/)?.[0]||'')}
function entryTeam(entry){return teams.find(([,rule])=>rule.test(entry.name||''))?.[0]||'其他'}
function entryGp(entry){const name=entry.name||'';if(entryYear(entry)==='2026'&&(String(entry.id||'').startsWith('minichamps-')||/Racing Bulls/i.test(name))&&/\b(?:Spain|Spanish)\s+GP\b/i.test(name))return 'Catalunya GP';return gpAliases.find(([,rule])=>rule.test(name))?.[0]||'OTHERS'}
function entryBrand(entry){if(entry.brand)return entry.brand;const catalogProduct=catalogById.get(String(entry.id));if(catalogProduct?.brand)return catalogProduct.brand;const id=String(entry.id||'').toLowerCase(),url=String(entry.url||'').toLowerCase();if(id.startsWith('minichamps-')||url.includes('minichamps.de'))return 'Minichamps';if(id.startsWith('looksmart-')||url.includes('looksmartmodels.com'))return 'Looksmart';if(id.startsWith('spark-')||url.includes('sparkmodel'))return 'Spark';return '其他'}
function searchableEntry(entry){return [entry.type,entry.name,entry.url,entry.product_number,entry.scale,entryBrand(entry),... (entry.fields||[]).flatMap(field=>[field.field,field.before,field.after])].filter(Boolean).join(' ').toLocaleLowerCase('zh-CN')}
function compareEntry(a,b,by){if(by==='gp'){const yearCompare=entryYear(a.entry).localeCompare(entryYear(b.entry));if(yearCompare)return yearCompare;const order=gpSchedules[entryYear(a.entry)]||[],aGp=entryGp(a.entry),bGp=entryGp(b.entry),aIndex=order.indexOf(aGp),bIndex=order.indexOf(bGp);return (aIndex<0?order.length:aIndex)-(bIndex<0?order.length:bIndex)||aGp.localeCompare(bGp,'zh-CN')}if(by==='team')return entryTeam(a.entry).localeCompare(entryTeam(b.entry),'zh-CN');if(by==='name')return (a.entry.name||'').localeCompare(b.entry.name||'','zh-CN');if(by==='product-number')return (a.entry.product_number||'').localeCompare(b.entry.product_number||'','zh-CN',{numeric:true});if(by==='scale')return Number(a.entry.scale?.split('/')[1]||0)-Number(b.entry.scale?.split('/')[1]||0);if(by==='type')return ({added:0,changed:1,removed:2}[a.entry.type]??3)-({added:0,changed:1,removed:2}[b.entry.type]??3);return a.index-b.index}
function renderReport(data,initial=false){
  reportRuns=data.updates||[];
  const query=search.value.trim().toLocaleLowerCase('zh-CN'),selectedType=typeFilter.value,selectedYear=yearFilter.value,selectedTeam=teamFilter.value,selectedBrand=brandFilter.value,selectedGp=gpFilter.value,selectedScale=scaleFilter.value,sortBy=sortSelect.value,descending=sortOrder.dataset.order==='desc';
  const visibleRuns=reportRuns.map((run,runIndex)=>({run,runIndex,entries:(run.entries||[]).map((entry,index)=>({entry,index})).filter(({entry})=>(!query||searchableEntry(entry).includes(query))&&(!selectedType||entry.type===selectedType)&&(!selectedYear||entryYear(entry)===selectedYear)&&(!selectedTeam||entryTeam(entry)===selectedTeam)&&(!selectedBrand||entryBrand(entry)===selectedBrand)&&(!selectedGp||entryGp(entry)===selectedGp)&&(!selectedScale||entry.scale===selectedScale)).sort((a,b)=>{const value=compareEntry(a,b,sortBy);return (descending?-value:value)||a.index-b.index})})).filter(item=>item.entries.length);
  const visibleCount=visibleRuns.reduce((sum,item)=>sum+item.entries.length,0),totalCount=reportRuns.reduce((sum,run)=>sum+(run.entries||[]).length,0);
  count.textContent=`显示 ${visibleCount} / ${totalCount} 项更新 · ${visibleRuns.length} / ${reportRuns.length} 个时间分组`;
  tocList.innerHTML=visibleRuns.length?visibleRuns.map(({run,runIndex,entries})=>`<a class="toc-link" href="#run-${runIndex}"><time class="toc-date" datetime="${esc(run.date)}">${esc(formatRunDate(run.date,{compact:true}))}</time><span class="toc-count">${entries.length} 项</span></a>`).join(''):'<p class="toc-empty">没有符合条件的报告</p>';
  report.innerHTML=visibleRuns.length?'<p>历史图片在原文件内容未变化时保留，点击图片可放大查看。</p>'+visibleRuns.map(({run,runIndex,entries})=>`<section class="run" id="run-${runIndex}"><h2><time datetime="${esc(run.date)}">${esc(formatRunDate(run.date))}</time>（北京时间） · ${entries.length} 项商品</h2><div class="entries">${entries.map(({entry,index})=>renderEntry(entry,`update-${runIndex}-${index}`)).join('')}</div></section>`).join(''):reportRuns.length?'<p>没有符合条件的更新记录，请调整搜索或筛选条件。</p>':'<p>还没有更新记录。下一次商品变化后会自动生成报告。</p>';
  if(initial&&location.hash){let targetId='';try{targetId=decodeURIComponent(location.hash.slice(1))}catch{}const target=document.getElementById(targetId);if(target){target.classList.add('highlighted');setTimeout(()=>target.classList.remove('highlighted'),2300);requestAnimationFrame(()=>{const header=document.querySelector('header'),offset=header&&getComputedStyle(header).position==='sticky'?header.getBoundingClientRect().height:0;window.scrollTo({top:target.getBoundingClientRect().top+window.scrollY-offset-12,behavior:'auto'})})}}
}
function setupFilters(data){const runs=data.updates||[],entries=runs.flatMap(run=>run.entries||[]),years=[...new Set(entries.map(entryYear).filter(Boolean))].sort((a,b)=>Number(b)-Number(a)),availableTeams=[...new Set(entries.map(entryTeam))].sort((a,b)=>a.localeCompare(b,'zh-CN')),brands=[...new Set(entries.map(entryBrand))].sort((a,b)=>a.localeCompare(b,'zh-CN')),scales=[...new Set(entries.map(entry=>entry.scale).filter(Boolean))].sort((a,b)=>Number(b.split('/')[1]||0)-Number(a.split('/')[1]||0));yearFilter.insertAdjacentHTML('beforeend',years.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join(''));teamFilter.insertAdjacentHTML('beforeend',availableTeams.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join(''));brandFilter.insertAdjacentHTML('beforeend',brands.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join(''));scaleFilter.insertAdjacentHTML('beforeend',scales.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join(''))}
function rebuildGpFilter(){const selectedYear=yearFilter.value;if(!selectedYear){gpFilter.innerHTML='<option value="">先选择年份</option>';gpFilter.disabled=true;return}const available=new Set(reportRuns.flatMap(run=>run.entries||[]).filter(entry=>entryYear(entry)===selectedYear).map(entryGp)),schedule=gpSchedules[selectedYear]||[],ordered=[...schedule.filter(name=>available.has(name)),...[...available].filter(name=>name!=='OTHERS'&&!schedule.includes(name)).sort((a,b)=>a.localeCompare(b,'zh-CN')),...(available.has('OTHERS')?['OTHERS']:[])];gpFilter.innerHTML='<option value="">全部大奖赛</option>'+ordered.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join('');gpFilter.disabled=false}
function loadReport(data){reportRuns=data.updates||[];setupFilters(data);rebuildGpFilter();renderReport(data,true)}
const filterToggle=document.querySelector('#toggle-filters'),filterCollapsedKey='sparkmodel-updates-filters-collapsed';function setFiltersCollapsed(collapsed){document.querySelector('header').classList.toggle('filters-collapsed',collapsed);filterToggle.setAttribute('aria-expanded',String(!collapsed));filterToggle.textContent=collapsed?'↓ 展开筛选':'↑ 收起筛选';try{localStorage.setItem(filterCollapsedKey,String(collapsed))}catch{}}filterToggle.addEventListener('click',()=>setFiltersCollapsed(!document.querySelector('header').classList.contains('filters-collapsed')));try{setFiltersCollapsed(localStorage.getItem(filterCollapsedKey)==='true')}catch{};new ResizeObserver(()=>document.documentElement.style.setProperty('--sticky-header-height',`${document.querySelector('header').getBoundingClientRect().height}px`)).observe(document.querySelector('header'));
let searchTimer;search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>renderReport({updates:reportRuns}),150)});yearFilter.addEventListener('change',()=>{gpFilter.value='';rebuildGpFilter();renderReport({updates:reportRuns})});[teamFilter,brandFilter,gpFilter,typeFilter,scaleFilter,sortSelect].forEach(select=>select.addEventListener('change',()=>renderReport({updates:reportRuns})));sortOrder.addEventListener('click',()=>{sortOrder.dataset.order=sortOrder.dataset.order==='asc'?'desc':'asc';sortOrder.textContent=sortOrder.dataset.order==='asc'?'↑':'↓';sortOrder.title=sortOrder.dataset.order==='asc'?'升序':'降序';renderReport({updates:reportRuns})});document.querySelector('#clear-filters').addEventListener('click',()=>{search.value='';typeFilter.value='';yearFilter.value='';teamFilter.value='';brandFilter.value='';gpFilter.value='';rebuildGpFilter();scaleFilter.value='';sortSelect.value='';sortOrder.dataset.order='asc';sortOrder.textContent='↑';sortOrder.title='升序';renderReport({updates:reportRuns})});
if(location.protocol==='file:'&&window.MODEL_UPDATES&&Array.isArray(window.MODEL_UPDATES.updates))loadReport(window.MODEL_UPDATES);
else fetch(`updates.json?v=${Date.now()}`,{cache:'no-store'}).then(response=>{if(!response.ok)throw Error();return response.json()}).then(loadReport).catch(()=>{document.querySelector('#report').innerHTML='<p>无法载入更新报告。请确认 updates.js 和 updates.json 与本页面位于同一目录。</p>';document.querySelector('#toc-list').innerHTML='<p class="toc-empty">目录载入失败</p>';count.textContent='更新报告载入失败'});
const modal=document.querySelector('#modal'),modalImage=document.querySelector('#modal-image'),modalThumbs=document.querySelector('#modal-thumbs'),backToTop=document.querySelector('#back-to-top');
let gallery={buttons:[],index:0,scale:1,x:0,y:0,dragging:false,swiping:false},returnFocus=null;
const setBackToTopVisible=visible=>{backToTop.classList.toggle('is-visible',visible);backToTop.setAttribute('aria-hidden',String(!visible));backToTop.tabIndex=visible?0:-1};
new IntersectionObserver(([entry])=>setBackToTopVisible(!entry.isIntersecting),{threshold:0}).observe(document.querySelector('.report-toc'));
backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
function applyView(){modalImage.style.transform=`translate(${gallery.x}px,${gallery.y}px) scale(${gallery.scale})`;modalImage.classList.toggle('dragging',gallery.dragging)}
function resetView(){Object.assign(gallery,{scale:1,x:0,y:0,dragging:false,swiping:false});applyView()}
function constrainPan(){const clamp=(value,limit)=>Math.max(-limit,Math.min(limit,value));gallery.x=clamp(gallery.x,modalImage.offsetWidth*gallery.scale/2);gallery.y=clamp(gallery.y,modalImage.offsetHeight*gallery.scale/2)}
function showImage(){const button=gallery.buttons[gallery.index];if(!button)return;modalImage.src=button.dataset.source;modalImage.alt=button.querySelector('img')?.alt||'更新图片';document.querySelector('#modal-meta').textContent=`${button.querySelector('span')?.textContent||''} · 图片 ${gallery.index+1} / ${gallery.buttons.length}`;modalThumbs.innerHTML=gallery.buttons.map((item,index)=>`<button type="button" data-index="${index}" class="${index===gallery.index?'active':''}" aria-label="查看第 ${index+1} 张图片"><img src="${esc(item.dataset.source)}" alt="${index+1}"></button>`).join('');modal.querySelectorAll('[data-step]').forEach(item=>item.disabled=gallery.buttons.length<2);resetView()}
function openGallery(button){const card=button.closest('.entry');gallery.buttons=[...card.querySelectorAll('.picture')];gallery.index=gallery.buttons.indexOf(button);const link=card.querySelector('h3 a'),modalLink=document.querySelector('#modal-link');modalLink.textContent=link?.textContent||card.querySelector('h3')?.textContent||'更新图片';modalLink.href=link?.href||'#';modalLink.hidden=!link;returnFocus=button;modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');showImage();modal.querySelector('.close').focus()}
function closeGallery(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');returnFocus?.focus()}
function moveImage(step){if(gallery.buttons.length<2)return;gallery.index=(gallery.index+step+gallery.buttons.length)%gallery.buttons.length;showImage()}
report.addEventListener('click',event=>{const button=event.target.closest('.picture');if(button)openGallery(button)});
modal.addEventListener('click',event=>{if(event.target.closest('.close')){closeGallery();return}const nav=event.target.closest('[data-step]');if(nav){moveImage(Number(nav.dataset.step));return}const thumb=event.target.closest('#modal-thumbs [data-index]');if(thumb){gallery.index=Number(thumb.dataset.index);showImage();return}if(event.target===modal)closeGallery()});
modal.querySelector('.stage').addEventListener('wheel',event=>{event.preventDefault();gallery.scale=Math.max(1,Math.min(8,gallery.scale*(event.deltaY<0?1.12:.89)));if(gallery.scale===1)gallery.x=gallery.y=0;constrainPan();applyView()},{passive:false});
modalImage.addEventListener('pointerdown',event=>{if(event.pointerType==='touch'&&gallery.scale===1){Object.assign(gallery,{swiping:true,swipeX:event.clientX,swipeY:event.clientY});modalImage.setPointerCapture(event.pointerId);return}if(gallery.scale===1||(event.pointerType==='mouse'&&event.button!==0))return;gallery.dragging=true;gallery.startX=event.clientX-gallery.x;gallery.startY=event.clientY-gallery.y;modalImage.setPointerCapture(event.pointerId);applyView()});
modalImage.addEventListener('pointermove',event=>{if(!gallery.dragging)return;gallery.x=event.clientX-gallery.startX;gallery.y=event.clientY-gallery.startY;constrainPan();applyView()});
function stopPointer(event){if(gallery.swiping){const dx=event.clientX-gallery.swipeX,dy=event.clientY-gallery.swipeY;gallery.swiping=false;if(modalImage.hasPointerCapture(event.pointerId))modalImage.releasePointerCapture(event.pointerId);if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy))moveImage(dx<0?1:-1);return}if(!gallery.dragging)return;gallery.dragging=false;if(modalImage.hasPointerCapture(event.pointerId))modalImage.releasePointerCapture(event.pointerId);applyView()}
modalImage.addEventListener('pointerup',stopPointer);modalImage.addEventListener('pointercancel',stopPointer);
modalImage.addEventListener('dblclick',()=>{gallery.scale=gallery.scale===1?2:1;if(gallery.scale===1)gallery.x=gallery.y=0;constrainPan();applyView()});
document.addEventListener('keydown',event=>{if(!modal.classList.contains('open'))return;if(event.key==='Escape')closeGallery();if(event.key==='ArrowLeft')moveImage(-1);if(event.key==='ArrowRight')moveImage(1)});
</script>
