</style>
<header>
  <h1>Spark Model Shop · Formula 1</h1><p id="updated">正在载入商品目录…</p>
  <div class="filters"><input id="search" placeholder="搜索商品、型号、年份、车手…" autofocus><select id="team"><option value="">全部车队</option></select><div class="gp-picker"><button class="gp-trigger" type="button" aria-expanded="false">全部大奖赛</button><div class="gp-menu" id="gp-menu"></div><select id="gp" aria-hidden="true" tabindex="-1"><option value="">全部大奖赛</option></select></div><select id="scale"><option value="">全部比例</option></select><select id="type"><option value="">全部分类</option></select><select id="sample"><option value="">全部样品</option><option value="yes">有样品</option><option value="no">无样品</option></select></div>
</header>
<main><p id="count"></p><section id="grid"></section></main>
<div id="modal" aria-hidden="true"><div class="modal-top"><div class="modal-heading"><a class="modal-title" id="modal-link" target="_blank" rel="noreferrer"></a><span class="modal-meta" id="modal-meta"></span></div><div class="modal-actions"><button class="locate" id="locate-product" type="button">定位商品</button><button class="close" type="button" aria-label="关闭">关闭 ×</button></div></div><div class="stage"><button class="nav product-nav" data-product-step="-1" aria-label="上一件商品" title="上一件商品">«</button><button class="nav" data-image-step="-1" aria-label="当前商品上一张图片" title="上一张图片">‹</button><img id="modal-image" alt="商品图片"><button class="nav" data-image-step="1" aria-label="当前商品下一张图片" title="下一张图片">›</button><button class="nav product-nav" data-product-step="1" aria-label="下一件商品" title="下一件商品">»</button></div><div id="modal-thumbs"></div></div>
<script>
const grid=document.querySelector('#grid'), modal=document.querySelector('#modal'), search=document.querySelector('#search'), selects=['team','gp','scale','type','sample'].map(id=>document.querySelector('#'+id)),gp=document.querySelector('#gp'),gpPicker=document.querySelector('.gp-picker'),gpTrigger=document.querySelector('.gp-trigger'),gpMenu=document.querySelector('#gp-menu');gpTrigger.addEventListener('click',()=>{const open=gpPicker.classList.toggle('open');gpTrigger.setAttribute('aria-expanded',open)});gpMenu.addEventListener('click',event=>{const option=event.target.closest('[data-gp]');if(!option)return;gp.value=option.dataset.gp;gpTrigger.textContent=option.dataset.label;gpPicker.classList.remove('open');gpTrigger.setAttribute('aria-expanded','false');gp.dispatchEvent(new Event('change'))});document.addEventListener('click',event=>{if(!gpPicker.contains(event.target)){gpPicker.classList.remove('open');gpTrigger.setAttribute('aria-expanded','false')}});
let products=[],shownProducts=[],gallery={position:0,index:0,scale:1,x:0,y:0,dragging:false,startX:0,startY:0};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const teams=[['Alpine',/alpine/i],['Aston Martin',/aston martin/i],['Audi',/\baudi\b/i],['Cadillac',/cadillac/i],['Ferrari',/\bferrari\b/i],['Haas',/\bhaas\b/i],['McLaren',/mclaren/i],['Mercedes',/mercedes/i],['Racing Bulls',/racing bulls|alphatauri/i],['Red Bull',/red bull/i],['Sauber',/sauber/i],['Williams',/williams/i],['Lotus',/lotus/i],['Tyrrell',/tyrrell/i],['Brabham',/brabham/i],['Benetton',/benetton/i],['Renault',/renault/i]];
function teamOf(p){return teams.find(([,rule])=>rule.test(p.name))?.[0]||'其他'} const gpSchedule=[['Preseason','2026-02-20'],['Australian GP','2026-03-08'],['Chinese GP','2026-03-15'],['Japanese GP','2026-03-29'],['Miami GP','2026-05-03'],['Canadian GP','2026-05-24'],['Monaco GP','2026-06-07'],['Catalunya GP','2026-06-14'],['Austrian GP','2026-06-28'],['British GP','2026-07-05'],['Belgian GP','2026-07-19'],['Hungarian GP','2026-07-26'],['Dutch GP','2026-08-23'],['Italian GP','2026-09-06'],['Spanish GP','2026-09-13'],['Azerbaijan GP','2026-09-26'],['Singapore GP','2026-10-11'],['United States GP','2026-10-25'],['Mexico City GP','2026-11-01'],['São Paulo GP','2026-11-08'],['Las Vegas GP','2026-11-21'],['Qatar GP','2026-11-29'],['Abu Dhabi GP','2026-12-06']],gpOrder=[...gpSchedule.map(([gp])=>gp),'OTHERS'],gpDates=Object.fromEntries(gpSchedule),grandsPrix=gpSchedule.slice(1).map(([gp])=>gp.slice(0,-3));function gpOf(p){if(/\bpre[- ]?season\b/i.test(p.name))return 'Preseason';if(/\bCanada\s+GP\b/i.test(p.name))return 'Canadian GP';return grandsPrix.find(gp=>new RegExp(`\\b${gp}\\s+GP\\b`,'i').test(p.name))?.concat(' GP')||'OTHERS'} function typeOf(p){return p.properties?.Scale==='1/5'?'头盔':'车模'} function sampleOf(p){return p.images.length>1?'yes':'no'} function descriptionOf(p){return(p.description||'').replace(/GTIN\/EAN:\s*[\w-]+/ig,'').replace(/\s{2,}/g,' ').trim()}
function fill(select,values,compare=(a,b)=>a.localeCompare(b,'zh-CN')){select.insertAdjacentHTML('beforeend',[...values].sort(compare).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(''))}
function rows(p,details=false){const extra={...p.properties,'Price':p.price&&p.currency?`${p.currency} ${p.price}`:'','Availability':p.availability,'Weight':p.weight,'Length':p.length},main=['Scale','Year','Product number','Availability'];return Object.entries(extra).filter(([k,v])=>v&&(details?!main.includes(k):main.includes(k))).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}
function render(){const query=search.value.toLowerCase(), team=document.querySelector('#team').value,gp=document.querySelector('#gp').value,scale=document.querySelector('#scale').value,type=document.querySelector('#type').value,sample=document.querySelector('#sample').value;const shown=products.filter(p=>JSON.stringify(p).toLowerCase().includes(query)&&(!team||teamOf(p)===team)&&(!gp||gpOf(p)===gp)&&(!scale||p.properties?.Scale===scale)&&(!type||typeOf(p)===type)&&(!sample||sampleOf(p)===sample));shownProducts=shown;document.querySelector('#count').textContent=`显示 ${shown.length} / ${products.length} 件商品`;
grid.innerHTML=shown.map(p=>`<article data-product-id="${esc(p.id)}"><div class="gallery"><button type="button" data-open="${esc(p.id)}" aria-label="查看 ${esc(p.name)} 的全部图片"><img class="gallery-main" src="${esc(p.images[0]||'')}" alt="${esc(p.name)}" loading="lazy"></button><span class="image-count">${p.images.length} 张图片</span>${p.images.length>1?`<div class="card-thumbs">${p.images.map((src,index)=>`<img src="${esc(src)}" data-open="${esc(p.id)}" data-index="${index}" alt="${index+1}" loading="lazy">`).join('')}</div>`:''}</div><div class="text"><h2 title="${esc(p.name)}"><a class="product-link" href="${esc(p.url)}" target="_blank" rel="noreferrer">${esc(p.name)}</a></h2><table><tbody>${rows(p)}</tbody></table><div class="details-popover"><button class="details-label" type="button">商品详情</button><div class="details-panel"><table><tbody>${rows(p,true)}</tbody></table><p class="description">${esc(descriptionOf(p))||'暂无描述'}</p></div></div></div></article>`).join('')}
function openGallery(id,index=0){const position=shownProducts.findIndex(p=>p.id===id);if(position<0)return;gallery={position,index:Number(index),scale:1,scrollY:window.scrollY};document.body.style.setProperty('--scroll-lock-top',`-${gallery.scrollY}px`);modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.documentElement.classList.add('modal-open');document.body.classList.add('modal-open');showImage();document.querySelector('.close').focus()}
function resetView(){Object.assign(gallery,{scale:1,x:0,y:0,dragging:false,swiping:false});applyView()}
function applyView(){const image=document.querySelector('#modal-image');image.style.transform=`translate(${gallery.x}px,${gallery.y}px) scale(${gallery.scale})`;image.classList.toggle('dragging',gallery.dragging)}
function constrainPan(){const image=document.querySelector('#modal-image'),clamp=(value,limit)=>Math.max(-limit,Math.min(limit,value));gallery.x=clamp(gallery.x,image.offsetWidth*gallery.scale/2);gallery.y=clamp(gallery.y,image.offsetHeight*gallery.scale/2)}
function showImage(){const p=shownProducts[gallery.position];if(!p)return;gallery.index=(gallery.index+p.images.length)%p.images.length;const image=document.querySelector('#modal-image');image.src=p.images[gallery.index];image.alt=p.name;resetView();const link=document.querySelector('#modal-link');link.textContent=`${p.name} · 商品 ${gallery.position+1} / ${shownProducts.length} · 图片 ${gallery.index+1} / ${p.images.length}`;link.href=p.url;document.querySelector('#modal-meta').textContent=`比例 ${p.properties?.Scale||'—'} · 年份 ${p.properties?.Year||p.year||'—'} · 货号 ${p.properties?.['Product number']||p.model||'—'}`;document.querySelector('#modal-thumbs').innerHTML=p.images.map((src,index)=>`<button type="button" data-index="${index}" class="${index===gallery.index?'active':''}" aria-label="查看第 ${index+1} 张"><img src="${esc(src)}" alt="${index+1}"></button>`).join('');document.querySelectorAll('[data-image-step]').forEach(button=>button.disabled=p.images.length<2);document.querySelectorAll('[data-product-step]').forEach(button=>button.disabled=shownProducts.length<2)}
function moveImage(step){const p=shownProducts[gallery.position];if(!p||p.images.length<2)return;gallery.index+=step;showImage()}
function moveProduct(step){if(shownProducts.length<2)return;gallery.position=(gallery.position+step+shownProducts.length)%shownProducts.length;gallery.index=0;showImage()}
function closeGallery(){const scrollY=gallery.scrollY??window.scrollY;modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.documentElement.classList.remove('modal-open');document.body.classList.remove('modal-open');document.body.style.removeProperty('--scroll-lock-top');requestAnimationFrame(()=>window.scrollTo(0,scrollY))}
function locateCurrentProduct(){const p=shownProducts[gallery.position];closeGallery();requestAnimationFrame(()=>{const card=[...grid.children].find(node=>node.dataset.productId===p?.id);if(!card)return;card.scrollIntoView({behavior:'smooth',block:'center'});card.classList.remove('located');requestAnimationFrame(()=>card.classList.add('located'));setTimeout(()=>card.classList.remove('located'),2300)})}
grid.addEventListener('click',event=>{const node=event.target.closest('[data-open]');if(node)openGallery(node.dataset.open,node.dataset.index||0)});modal.addEventListener('click',event=>{if(!event.target.closest('#modal-image,button,a')){closeGallery();return}if(event.target.closest('#locate-product')){locateCurrentProduct();return}if(event.target.closest('.close')){closeGallery();return}const productNav=event.target.closest('[data-product-step]');if(productNav){moveProduct(Number(productNav.dataset.productStep));return}const imageNav=event.target.closest('[data-image-step]');if(imageNav){moveImage(Number(imageNav.dataset.imageStep));return}const thumb=event.target.closest('#modal-thumbs [data-index]');if(thumb){gallery.index=Number(thumb.dataset.index);showImage()}});modal.addEventListener('wheel',event=>{if(!modal.classList.contains('open'))return;event.preventDefault();gallery.scale=Math.max(.5,Math.min(8,gallery.scale*(event.deltaY<0?1.12:.89)));if(gallery.scale<=1)gallery.x=gallery.y=0;constrainPan();applyView()},{passive:false});const modalImage=document.querySelector('#modal-image');modalImage.addEventListener('pointerdown',event=>{if(event.pointerType==='touch'&&gallery.scale<=1){Object.assign(gallery,{swiping:true,swipeX:event.clientX,swipeY:event.clientY});modalImage.setPointerCapture(event.pointerId);return}if(gallery.scale<=1||(event.pointerType==='mouse'&&event.button!==0))return;gallery.dragging=true;gallery.startX=event.clientX-gallery.x;gallery.startY=event.clientY-gallery.y;modalImage.setPointerCapture(event.pointerId);applyView()});modalImage.addEventListener('pointermove',event=>{if(!gallery.dragging)return;gallery.x=event.clientX-gallery.startX;gallery.y=event.clientY-gallery.startY;constrainPan();applyView()});const stopDrag=event=>{if(gallery.swiping){const dx=event.clientX-gallery.swipeX,dy=event.clientY-gallery.swipeY;gallery.swiping=false;if(modalImage.hasPointerCapture(event.pointerId))modalImage.releasePointerCapture(event.pointerId);if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy))moveImage(dx<0?1:-1);return}if(!gallery.dragging)return;gallery.dragging=false;if(modalImage.hasPointerCapture(event.pointerId))modalImage.releasePointerCapture(event.pointerId);applyView()};modalImage.addEventListener('pointerup',stopDrag);modalImage.addEventListener('pointercancel',stopDrag);modalImage.addEventListener('dblclick',()=>{gallery.scale=gallery.scale===1?2:1;if(gallery.scale===1)gallery.x=gallery.y=0;constrainPan();applyView()});document.addEventListener('keydown',event=>{if(!modal.classList.contains('open'))return;if(event.key==='Escape')closeGallery();if(event.key==='ArrowLeft')moveImage(-1);if(event.key==='ArrowRight')moveImage(1)});search.addEventListener('input',render);selects.forEach(select=>select.addEventListener('change',render));
fetch('catalog.json').then(response=>response.json()).then(data=>{products=data.products;fill(document.querySelector('#team'),new Set(products.map(teamOf)));fill(gp,new Set(products.map(gpOf)),(a,b)=>gpOrder.indexOf(a)-gpOrder.indexOf(b));gpMenu.innerHTML=[['','全部大奖赛'],...[...new Set(products.map(gpOf))].sort((a,b)=>gpOrder.indexOf(a)-gpOrder.indexOf(b)).map(value=>[value,gpDates[value]?`${value} · ${gpDates[value].slice(5)}`:value])].map(([value,label])=>`<button class="gp-option" type="button" data-gp="${esc(value)}" data-label="${esc(value||label)}"><span>${esc(value||label)}</span>${gpDates[value]?`<span class="gp-date">${esc(gpDates[value].slice(5))}</span>`:''}</button>`).join('');fill(document.querySelector('#scale'),new Set(products.map(p=>p.properties?.Scale).filter(Boolean)),(a,b)=>Number(b.split('/')[1])-Number(a.split('/')[1]));fill(document.querySelector('#type'),new Set(products.map(typeOf)));document.querySelector('#updated').textContent=`更新于 ${new Date(data.generated_at).toLocaleString()} · 本站图片均为本地副本`;render()}).catch(()=>document.querySelector('#updated').textContent='无法载入 catalog.json');
</script>
