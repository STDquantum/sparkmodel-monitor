<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.ico"><title>本地商品管理</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#101217;color:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:#171b23;padding:1.5rem max(1rem,calc((100% - 1280px)/2))}h1{margin:.7rem 0}a{color:#85b9ff}main{max-width:1280px;margin:auto;padding:1.25rem;display:grid;grid-template-columns:320px 1fr;gap:1.2rem}section{background:#1a1f28;border:1px solid #29313d;border-radius:.8rem;padding:1rem}input,select,textarea,button{font:inherit;background:#101217;color:#fff;border:1px solid #526074;border-radius:.5rem;padding:.7rem}input,select,textarea{width:100%}button{cursor:pointer}button:hover{background:#263448}button:disabled{opacity:.5;cursor:wait}label{display:block;color:#b9c2d0;margin-bottom:1rem}label>input,label>select,label>textarea{margin-top:.4rem}#list{max-height:65vh;overflow:auto;display:grid;gap:.5rem;margin-top:.7rem}#list button{text-align:left;font-size:.85rem}#list button.active{border-color:#85b9ff;background:#263448}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}.full{grid-column:1/-1}.images{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.7rem;margin:1rem 0}.image{border:1px solid #526074;border-radius:.5rem;overflow:hidden}.image img{width:100%;height:110px;object-fit:contain;background:white;cursor:zoom-in}.image button{width:100%;border:0;border-radius:0;color:#ff9a9a}.image span{display:block;padding:.3rem;font-size:.75rem;color:#b9c2d0}p{color:#b9c2d0;line-height:1.5}#status{white-space:pre-wrap}#preview{border:0;padding:0;background:transparent;max-width:90vw;max-height:90vh}#preview img{display:block;max-width:90vw;max-height:90vh}#preview::backdrop{background:#000d}@media(max-width:760px){main{grid-template-columns:1fr}.fields{grid-template-columns:1fr}#list{max-height:220px}}
</style>
<header><a href="index.html?edit=1">← 时间标注</a> · <a href="index.html">主网页</a><h1>本地商品管理</h1><p>手动添加与修改商品，管理图片。保存后生效，自动采集会保留手动修改和手动图片。</p></header>
<main><section><button id="new" type="button">＋ 添加商品</button><p>修改已有商品</p><input id="search-products" placeholder="搜索名称、货号、厂商"><div id="list"></div></section>
<section><h2 id="heading">添加商品</h2><form id="editor"><div class="fields">
<label class="full">商品名称<input name="name" placeholder="可选，留空时自动生成名称"></label>
<label>Year *<select name="year" required></select></label><label>Manufacturer *<input name="manufacturer" required placeholder="Spark / Minichamps / Looksmart"></label>
<label>Scale *<select name="scale" required></select></label><label>Product number *<input name="model" required></label>
<label>Availability *<select name="availability" required><option value="">请选择</option><option>Available</option><option>Pre-order</option><option>Catalogue</option></select></label>
<label>商品链接<input name="url" type="url" placeholder="https://…（可选）"></label><label class="full">商品描述<textarea name="description" rows="3"></textarea></label></div>
<h3>其他商品详情</h3><div id="extra-properties"></div><button id="add-property" type="button">＋ 添加详情项</button><p>填写字段名称和内容，例如车手、比赛、材质。保存后展示在商品详情中。</p>
<label>增加图片（可多选，PNG / JPEG / GIF / WebP，每张不超过 15 MB）<input id="uploads" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp"></label>
<div id="images" class="images"></div><p>图片点击可看大图。删除与新增在点击保存后生效；相同图片按文件内容去重。</p><button id="save" type="submit">保存商品</button><p id="status" role="status"></p></form></section></main>
<dialog id="preview"><img alt="商品大图"></dialog>
<script src="catalog.js"></script><script src="manual-products.js"></script><script src="manual-products-merge.js"></script><script src="product-editor.js"></script></html>
